name: BConnect isolated PostgreSQL integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/sql-staging/**'
      - 'tests/fixtures/**'
      - '.github/workflows/bconnect-postgres-integration.yml'
  push:
    branches:
      - feat/bconnect-invoice-reconciliation-20261006
    paths:
      - 'docs/sql-staging/**'
      - 'tests/fixtures/**'
      - '.github/workflows/bconnect-postgres-integration.yml'
permissions:
  contents: read
jobs:
  atomic-edit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: bconnect_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bconnect_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: fixture-only
      PGDATABASE: bconnect_fixture
      PGOPTIONS: '-c app.bconnect_staging_approved=yes'
    steps:
      - uses: actions/checkout@v4
      - name: Provision disposable schema and guarded SQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/bconnect-postgres-schema.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql-staging/bconnect_atomic_foundation_v1.sql
          psql -v ON_ERROR_STOP=1 -f docs/sql-staging/bconnect_atomic_edit_v1.sql
      - name: Run rollback-only integration assertions
        run: |
          set -euo pipefail
          sed -e 's/REPLACE_TEST_INVOICE_ID/fixture-invoice-1/g' \
              -e 's/REPLACE_TEST_STAFF_SESSION_TOKEN/fixture-token-only/g' \
              docs/sql-staging/bconnect_atomic_edit_fixture_test_v1.sql > /tmp/bconnect_fixture_test.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/bconnect_fixture_test.sql
          result="$(psql -At -v ON_ERROR_STOP=1 -c "SELECT notes FROM public.purchase_invoices WHERE id='fixture-invoice-1'")"
          test "$result" = 'original'
      - name: Verify concurrent edits use optimistic revision gate
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/bconnect-concurrent-edit.sql
