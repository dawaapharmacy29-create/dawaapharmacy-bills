name: Apply system health API

on:
  push:
    branches: [agent/safe-platform-hardening]
    paths:
      - '.github/scripts/apply-system-health-api.mjs'
      - '.github/workflows/apply-system-health-api.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ !contains(github.event.head_commit.message, 'apply system health API') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/safe-platform-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node .github/scripts/apply-system-health-api.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/base44Client.js
          git commit -m "fix: apply system health API" || exit 0
          git push origin HEAD:agent/safe-platform-hardening
