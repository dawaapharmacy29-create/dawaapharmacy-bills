name: Apply canonical financial summary

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply-canonical-financial-summary.mjs'
      - '.github/workflows/apply-canonical-financial-summary.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    if: ${{ !contains(github.event.head_commit.message, 'apply canonical financial summary') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: node .github/scripts/apply-canonical-financial-summary.mjs
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/base44Client.js src/pages/Dashboard.jsx
          git commit -m "fix: apply canonical financial summary" || exit 0
          git push origin HEAD:main
