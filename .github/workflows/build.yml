name: Build

on:
  push:
    branches: [main, experiment/purchase-architecture-v2]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run purchase regression tests
        run: npm run test
      - name: Build application
        run: npm run build
