name: Apply purchase order titles

on:
  push:
    paths:
      - '.github/codex-triggers/apply_purchase_order_titles.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/add_purchase_order_titles.cjs
      - run: npm ci
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SmartPurchaseUnifiedCenter.jsx
          git diff --cached --quiet || git commit -m "إضافة أسماء مخصصة للطلبيات"
          git push
